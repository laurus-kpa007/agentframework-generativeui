servers:
  custom:
    args:
    - ./mcp_servers/custom_server.js
    command: node
    description: Custom tools
    enabled: false
  filesystem:
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - .
    command: npx
    description: Local filesystem access
    enabled: true
  github:
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    command: npx
    description: GitHub repository integration
    enabled: false
    env:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
  tavily:
    args:
    - -y
    - tavily-mcp@0.1.3
    command: npx
    description: Web search using Tavily API
    enabled: true
    env:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
  weather:
    args:
    - -y
    - '@yarflam/weather-mcp-server'
    command: npx
    description: Weather information from Open-Meteo
    enabled: true
